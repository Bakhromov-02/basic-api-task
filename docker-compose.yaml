services:
  db:
    image: postgres:17.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TYPEORM_USERNAME}
      POSTGRES_PASSWORD: ${TYPEORM_PASSWORD}
      POSTGRES_DB: ${TYPEORM_DATABASE}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Exposed on the host so you can also run the API locally with `npm run start:dev`.
      - ${TYPEORM_PORT}:5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${TYPEORM_USERNAME} -d ${TYPEORM_DATABASE}']
      interval: 2s
      timeout: 5s
      retries: 15

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Inside the compose network the database is reachable as `db` on its default port.
      TYPEORM_HOST: db
      TYPEORM_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 7001:${API_PORT}

volumes:
  pgdata:
