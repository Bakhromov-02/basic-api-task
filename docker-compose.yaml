services:
  db:
    image: postgres:17.4-alpine
    container_name: ${TYPEORM_DATABASE}
    restart: always
    environment:
      POSTGRES_USER: ${TYPEORM_USERNAME}
      POSTGRES_PASSWORD: ${TYPEORM_PASSWORD}
      POSTGRES_DB: ${TYPEORM_DATABASE}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    ports:
      - ${TYPEORM_PORT}:5432
    env_file:
      - .env
    networks:
      - app-network

  app:
    container_name: app
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - 7001:${API_PORT}
    restart: always
    networks:
      - app-network

volumes:
  pgdata:


networks:
  app-network:
    driver: bridge
